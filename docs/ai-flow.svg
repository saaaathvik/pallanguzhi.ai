<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 190" width="990" height="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="990" height="190" fill="#ffffff"/>

  <g font-size="15" fill="#1f2328" text-anchor="middle">
    <!-- Cards: x = 16 + i * 196, width 170 -->
    <g filter="url(#shadow)">
      <rect x="16" y="24" width="170" height="142" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="212" y="24" width="170" height="142" rx="12" fill="#fff8ec" stroke="#e8c48a"/>
      <rect x="408" y="24" width="170" height="142" rx="12" fill="#fff8ec" stroke="#e8c48a"/>
      <rect x="604" y="24" width="170" height="142" rx="12" fill="#fff8ec" stroke="#e8c48a"/>
      <rect x="800" y="24" width="170" height="142" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    </g>

    <g font-size="14" font-weight="600" fill="#ffffff">
      <circle cx="101" cy="58" r="15" fill="#c47f1a"/><text x="101" y="63">1</text>
      <circle cx="297" cy="58" r="15" fill="#c47f1a"/><text x="297" y="63">2</text>
      <circle cx="493" cy="58" r="15" fill="#c47f1a"/><text x="493" y="63">3</text>
      <circle cx="689" cy="58" r="15" fill="#c47f1a"/><text x="689" y="63">4</text>
      <circle cx="885" cy="58" r="15" fill="#c47f1a"/><text x="885" y="63">5</text>
    </g>

    <text x="101" y="106">You play</text>
    <text x="101" y="126">a move</text>

    <text x="297" y="100">Page sends the board</text>
    <text x="297" y="120">to a background</text>
    <text x="297" y="140">thread</text>

    <text x="493" y="106" font-weight="600">Alpha-beta search</text>
    <text x="493" y="126">to the chosen depth</text>

    <text x="689" y="106">Best move sent back</text>
    <text x="689" y="126">to the page</text>

    <text x="885" y="100">1 second pause,</text>
    <text x="885" y="120">then the move is</text>
    <text x="885" y="140">animated</text>
  </g>

  <g stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="189" y1="95" x2="207" y2="95"/>
    <line x1="385" y1="95" x2="403" y2="95"/>
    <line x1="581" y1="95" x2="599" y2="95"/>
    <line x1="777" y1="95" x2="795" y2="95"/>
  </g>
</svg>
